[package]
name = "mai-motion-demo"
version = "1.3.3"
edition = "2021"
rust-version = "1.85"
description = "Maimai hand motion visualizer"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
ed25519-dalek = "2"
mai-motion-core = { path = ".." }
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "macros"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

[features]
# 本機整合測試用；測試檔不在這個 repo 裡，平常不要開。
local-plugin-test = []
