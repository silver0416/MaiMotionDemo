<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9e9e6" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <script>
      // 主題在第一次繪製前套用（不閃色）：跟隨系統／深色（classic，不設 data-palette）／淺色（studio）。
      // 和 src/lib/shell/theme.svelte.ts 的 apply() 做同一件事，改一邊要一起改。
      (function () {
        var mode = 'system';
        try {
          var saved = localStorage.getItem('maimotion.docs.theme');
          if (saved === 'dark' || saved === 'light') mode = saved;
        } catch (e) {}
        var light = mode === 'light' || (mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        var root = document.documentElement;
        if (light) root.setAttribute('data-palette', 'studio');
        root.setAttribute('data-scheme', light ? 'light' : 'dark');
        if (mode !== 'system') {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', light ? '#e9e9e6' : '#0b0d11');
        }
      })();
    </script>
    <script>
      // App 外框在第一次繪製前套用（不閃一般外框）：從主畫面開啟（standalone）時依系統套 iOS／Android 外框；
      // 網址的 ?app=ios|android|off 是預覽開關（存在 sessionStorage，只影響這個分頁）。
      // 和 src/lib/app/platform.svelte.ts 的 initPlatform() 規則相同，改一邊要一起改。
      (function () {
        var KEY = 'maimotion.docs.app-preview';
        var app = null;
        var nav = navigator;
        var ua = nav.userAgent;
        // 手機的系統（和是不是 standalone 無關）：首頁用它在第一次繪製前把「下載」換成「安裝到手機」。
        var os = null;
        if (/iPhone|iPad|iPod/.test(ua) || (nav.platform === 'MacIntel' && nav.maxTouchPoints > 1)) os = 'ios';
        else if (/Android/.test(ua)) os = 'android';
        if (os) document.documentElement.setAttribute('data-os', os);
        try {
          var param = new URLSearchParams(location.search).get('app');
          if (param === 'ios' || param === 'android') sessionStorage.setItem(KEY, param);
          else if (param === 'off') sessionStorage.removeItem(KEY);
          var preview = sessionStorage.getItem(KEY);
          if (preview === 'ios' || preview === 'android') app = preview;
        } catch (e) {}
        if (!app) {
          var standalone = matchMedia('(display-mode: standalone)').matches || nav.standalone === true;
          if (standalone) app = os;
        }
        if (app) document.documentElement.setAttribute('data-app', app);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
