<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e9e9e6" media="(prefers-color-scheme: light)" />
    <title>目前離線 · MaiMotionDemo</title>
    <!--
      離線又沒有快取的頁面由 service worker（src/service-worker/index.ts）回這一頁。
      它不能依賴任何其他檔案（可能都沒快取），所以樣式寫在這裡：顏色照 App 的 tokens
      （frontend/src/styles/app.css 的 classic 與 studio），按鈕照 .btn--primary 的膠囊。
      主題腳本和 src/app.html 的那段做同一件事；行內 script 的 hash 由 worker/vite.config.ts 自動算進 CSP。
    -->
    <script>
      (function () {
        var mode = 'system';
        try {
          var saved = localStorage.getItem('maimotion.docs.theme');
          if (saved === 'dark' || saved === 'light') mode = saved;
        } catch (e) {}
        var light = mode === 'light' || (mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-scheme', light ? 'light' : 'dark');
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --c-bg: #0b0d11;
        --c-text: #e9edf4;
        --c-text-dim: #9ba6b6;
        --c-text-strong: #ffffff;
        --c-ring: #e9edf4;
        --c-left: #f2679d;
        --c-right: #4fb8f5;
        --c-primary: #4fb8f5;
        --c-on-primary: #0b0d11;
        --c-focus: #4fb8f5;
      }

      :root[data-scheme='light'] {
        color-scheme: light;
        --c-bg: #e9e9e6;
        --c-text: #1c1d20;
        --c-text-dim: #5e6066;
        --c-text-strong: #000000;
        --c-ring: #1c1d20;
        --c-left: #d63c7a;
        --c-right: #1f72c9;
        --c-primary: #1f72c9;
        --c-on-primary: #ffffff;
        --c-focus: #1f72c9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--c-bg);
        color: var(--c-text);
        font-family: 'Segoe UI', 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        min-height: 100dvh;
        padding: calc(32px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }

      svg {
        display: block;
      }

      .ring {
        fill: none;
        stroke: var(--c-ring);
        stroke-width: 10.5;
      }

      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        color: var(--c-text-strong);
      }

      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        color: var(--c-text-dim);
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 24px;
        border-radius: 999px;
        background: var(--c-primary);
        color: var(--c-on-primary);
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition: transform 90ms ease-out;
      }

      a:active {
        transform: scale(0.96);
      }

      a:focus-visible {
        outline: 2px solid var(--c-focus);
        outline-offset: 2px;
      }

      @media (prefers-reduced-motion: reduce) {
        a {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring" cx="50" cy="50" r="38" />
        <circle cx="36" cy="50" r="10" fill="var(--c-left)" />
        <circle cx="64" cy="50" r="10" fill="var(--c-right)" />
      </svg>
      <h1>目前離線</h1>
      <p>這一頁還沒存在手機裡，連上網路後再開一次。</p>
      <a href="/">回首頁</a>
    </main>
  </body>
</html>
