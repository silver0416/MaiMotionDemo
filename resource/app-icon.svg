<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="MaiMotion">
  <!-- backdrop -->
  <rect width="128" height="128" rx="26" fill="#0d0f14"/>

  <!-- dark play disc -->
  <circle cx="64" cy="64" r="44" fill="#161a23" stroke="#262d3c" stroke-width="3"/>
  <circle cx="64" cy="64" r="6" fill="#262d3c"/>

  <!-- idle touch positions -->
  <g fill="#333c50">
    <circle cx="108" cy="64" r="3.5"/>
    <circle cx="64" cy="20" r="3.5"/>
    <circle cx="32.9" cy="32.9" r="3.5"/>
    <circle cx="20" cy="64" r="3.5"/>
    <circle cx="64" cy="108" r="3.5"/>
    <circle cx="95.1" cy="95.1" r="3.5"/>
  </g>

  <!-- slide path linking the two hands -->
  <line x1="45" y1="83" x2="83" y2="45" stroke="#2b3244" stroke-width="4" stroke-linecap="round"/>

  <!-- left hand: tap contact -->
  <circle cx="32.9" cy="95.1" r="10" fill="#4ec9f5"/>

  <!-- right hand: slide contact -->
  <polygon points="102.2,25.8 96.3,43.5 85.5,30.7" fill="#ffb347"/>
</svg>
