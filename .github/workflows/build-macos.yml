name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the .app to (e.g. v0.4.11)
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - run: npm ci

      - name: Build universal .app
        run: >
          npm run tauri build --
          --target universal-apple-darwin
          --bundles app
          --config '{"bundle":{"active":true,"targets":["app"],"icon":["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.icns","icons/icon.ico"]}}'

      - name: Zip .app
        run: |
          APP=$(find . -path '*universal-apple-darwin/release/bundle/macos/*.app' -maxdepth 8 -type d | head -1)
          echo "Found: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "MaiMotionDemo-${{ inputs.tag }}-macos-universal.zip"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "MaiMotionDemo-${{ inputs.tag }}-macos-universal.zip" --clobber
