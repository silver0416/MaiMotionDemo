name: Build release (Linux / macOS)

# 發布 Release 時自動建置 Linux 與 macOS 版並附到同一個 Release；Windows 版仍在本機建置後上傳。
# 也可以手動指定 tag 重跑（例如補上舊版的產物）。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. v1.0.0)
        required: true
      macos:
        description: Also rebuild macOS (uncheck to rebuild Linux only)
        type: boolean
        default: true
      upload:
        description: Attach the files to the release (uncheck to only build, check and keep them as a workflow artifact)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          # vite.config.ts 用 commit 數當 build 號，需要完整歷史。
          fetch-depth: 0

      # gstreamer1.0-* 是要打包進 AppImage 的影片外掛（見「Pick GStreamer plugins」）。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-gl gstreamer1.0-alsa

      # AppImage 檢查用的程式與測試影片（見「Check AppImage」）。檔案取自這個 workflow 所在的提交
      # （GITHUB_SHA），不是要建置的 tag：重建舊版時，舊 tag 裡還沒有這些檔案。
      # 先在這裡編譯，寫錯了不必等建置完才發現。
      - name: Prepare AppImage check
        run: |
          CHECK="$RUNNER_TEMP/check"
          mkdir -p "$CHECK/media"
          git archive "$GITHUB_SHA" .github/appimage-check | tar -x -C "$RUNNER_TEMP"
          FILES="$RUNNER_TEMP/.github/appimage-check"
          cp "$FILES/check.sh" "$CHECK/"
          cp "$FILES/media.html" "$CHECK/media/"
          gcc -O2 -Wall -o "$CHECK/media-check" "$FILES/media-check.c" $(pkg-config --cflags --libs webkit2gtk-4.1)
          sudo apt-get install -y -qq --no-install-recommends ffmpeg > /dev/null
          cd "$CHECK/media"
          src=testsrc2=size=1280x720:rate=30
          # yt-dlp 下載的 YouTube 影片：只有畫面、H.264 High、分段 mp4
          ffmpeg -v error -f lavfi -i "$src" -t 4 -c:v libx264 -profile:v high -pix_fmt yuv420p -g 30 \
            -movflags +frag_keyframe+empty_moov+default_base_moof h264-frag.mp4
          # 沒有 H.264 時下載的 VP9 webm
          ffmpeg -v error -f lavfi -i "$src" -t 4 -c:v libvpx-vp9 -b:v 1M -deadline realtime -cpu-used 8 vp9.webm
          # 自己選的本機影片：H.264＋AAC 音訊，moov 在檔尾
          ffmpeg -v error -f lavfi -i "$src" -f lavfi -i sine=frequency=440:sample_rate=48000 -t 4 \
            -c:v libx264 -profile:v high -pix_fmt yuv420p -c:a aac h264-aac.mp4
          # 只有一個軌的一般 mp4（逐格讀取與 WebCodecs）
          ffmpeg -v error -f lavfi -i "$src" -t 4 -c:v libx264 -profile:v high -pix_fmt yuv420p \
            -movflags +faststart h264.mp4
          ls -la

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - run: npm ci

      # Tauri CLI 2.11 下載的 linuxdeploy 是 2024 年 7 月的版本，排除清單太舊，會把建置機的
      # libwayland-client 打包進 AppImage。較新的 Mesa（例如 Ubuntu 26.04）配上這個舊版會載入失敗，
      # WebKitWebProcess 印出「Could not create default EGL display: EGL_BAD_PARAMETER. Aborting...」後中止，
      # 視窗打不開（tauri-apps/tauri#15976）。這裡先把 Tauri 2.12 起改用的新版放進 Tauri 的工具快取，
      # Tauri 看到檔案已存在就不會再下載舊版。@tauri-apps/cli 升到 2.12 以上後可以拿掉這一步。
      - name: Use newer linuxdeploy
        env:
          LINUXDEPLOY_URL: https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
          LINUXDEPLOY_SHA256: 36a2d7e274d12e1050d0e9ecfe11d339ed54720b2bec464c286d53f8b07f5c62
        run: |
          TOOLS="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          mkdir -p "$TOOLS"
          curl -fsSL --retry 3 -o "$TOOLS/linuxdeploy-x86_64.AppImage" "$LINUXDEPLOY_URL"
          echo "$LINUXDEPLOY_SHA256  $TOOLS/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x "$TOOLS/linuxdeploy-x86_64.AppImage"

      # AppImage 裡的 AppRun 會把 GStreamer 的外掛路徑指到 AppImage 內，只載入 AppImage 附的外掛；
      # 不附外掛就完全不能播影片（影片視窗、手部分析都用 WebKit 的 GStreamer 解碼）。
      # 這裡只挑出播放 App 用到的影片所需的外掛：mp4／mov／webm／mkv、H.264（libav）、VP8／VP9、
      # AAC／Opus／Vorbis 音訊、WebKit 的 GL 畫面輸出與聲音輸出，再交給 Tauri 的 GStreamer 打包步驟
      # （bundleMediaFramework，見下一步的 --config）。只放需要的，AppImage 才不會大太多。
      - name: Pick GStreamer plugins
        run: |
          src=/usr/lib/x86_64-linux-gnu/gstreamer-1.0
          dst="$RUNNER_TEMP/gst-plugins"
          mkdir -p "$dst"
          for name in \
            coreelements app playback typefindfunctions pbtypes \
            videoconvert videoscale videofilter opengl \
            audioconvert audioresample volume autodetect pulseaudio alsa \
            isomp4 matroska audioparsers videoparsersbad \
            libav vpx opus vorbis; do
            cp "$src/libgst$name.so" "$dst/"
          done
          ls -la "$dst"
          echo "GSTREAMER_PLUGINS_DIR=$dst" >> "$GITHUB_ENV"

      - name: Build AppImage and deb
        run: >
          npm run tauri build --
          --bundles appimage,deb
          --config '{"bundle":{"active":true,"targets":["appimage","deb"],"icon":["icons/linux/32x32.png","icons/linux/128x128.png","icons/linux/128x128@2x.png","icons/linux/icon.png"],"linux":{"appimage":{"bundleMediaFramework":true}}}}'

      - name: Collect artifacts
        run: |
          mkdir -p out
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          DEB=$(find src-tauri/target/release/bundle/deb -name '*.deb' | head -1)
          echo "AppImage: $APPIMAGE"
          echo "deb: $DEB"
          cp "$APPIMAGE" "out/MaiMotionDemo-${TAG}-linux-x64.AppImage"
          cp "$DEB" "out/MaiMotionDemo-${TAG}-linux-x64.deb"
          ls -la out

      # 上傳前先確認 AppImage：
      # 1. 不能打包 libwayland-client，要用使用者系統上的版本（理由見上面的 linuxdeploy 步驟）。
      # 2. 要附 GStreamer 外掛（理由見上面的外掛步驟）。
      # 3. 在最舊（22.04）和最新（26.04）的 Ubuntu 容器裡打得開，而且播得了影片
      #    （做法見 .github/appimage-check/check.sh）。
      - name: Check AppImage
        run: |
          CHECK="$RUNNER_TEMP/check"
          cp "out/MaiMotionDemo-${TAG}-linux-x64.AppImage" "$CHECK/app.AppImage"
          cd "$CHECK"
          ./app.AppImage --appimage-extract > /dev/null
          if find squashfs-root -name 'libwayland-client.so*' | grep .; then
            echo "::error::AppImage bundles libwayland-client"
            exit 1
          fi
          if [ ! -d squashfs-root/usr/lib/gstreamer-1.0 ]; then
            echo "::error::AppImage has no GStreamer plugins"
            exit 1
          fi
          du -sh squashfs-root/usr/lib squashfs-root/usr/lib/gstreamer-1.0
          rm -rf squashfs-root
          failed=0
          for image in ubuntu:22.04 ubuntu:26.04; do
            echo "::group::$image"
            if ! docker run --rm -v "$CHECK:/work" -w /work "$image" bash /work/check.sh; then
              echo "::error::AppImage check failed on $image"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Upload to release
        if: github.event_name == 'release' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" out/* --clobber

      - name: Keep the files as a workflow artifact
        if: github.event_name == 'workflow_dispatch' && !inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ env.TAG }}
          path: out/

  macos:
    if: github.event_name == 'release' || inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> target

      - run: npm ci

      - name: Build universal .app
        run: >
          npm run tauri build --
          --target universal-apple-darwin
          --bundles app
          --config '{"bundle":{"active":true,"targets":["app"],"icon":["icons/32x32.png","icons/128x128.png","icons/128x128@2x.png","icons/icon.icns","icons/icon.ico"]}}'

      - name: Zip .app
        run: |
          APP=$(find . -path '*universal-apple-darwin/release/bundle/macos/*.app' -maxdepth 8 -type d | head -1)
          echo "Found: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "MaiMotionDemo-${TAG}-macos-universal.zip"

      - name: Upload to release
        if: github.event_name == 'release' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "MaiMotionDemo-${TAG}-macos-universal.zip" --clobber

      - name: Keep the file as a workflow artifact
        if: github.event_name == 'workflow_dispatch' && !inputs.upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.TAG }}
          path: MaiMotionDemo-${{ env.TAG }}-macos-universal.zip
